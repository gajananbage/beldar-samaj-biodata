<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>बेलदार समाज - परिचय पत्र जनरेटर</title>
    <meta name="description" content="बेलदार समाज परिचय पत्र - भरणा व डाऊनलोड सुविधा.">

    <link rel="manifest" href="/manifest.json"> 
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#b8860b"> 
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;700&family=Dancing+Script:wght@700&family=Open+Sans:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- CSS STYLES (As provided previously) --- */
        :root {
            --gold: #b8860b;
            --gold-light: #d4af37;
            --red: #c0392b;
            --border: #8b5a2b;
            --text: #333;
            --modern-accent: #000000;
            --modern-light-bg: #f5f5f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Serif Devanagari', 'Devanagari', Georgia, serif;
            background: linear-gradient(135deg, #fdf6e3 0%, #f5e6cc 100%);
            padding: 15px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .form-container { max-width: 520px; margin: 20px auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(184, 134, 11, 0.2); border: 3px solid var(--gold-light); }
        .logo { text-align: center; margin-bottom: 8px; font-family: 'Dancing Script', cursive; font-size: 2.2em; color: var(--red); font-weight: 700; letter-spacing: 1.5px; background: linear-gradient(45deg, #c0392b, #e74c3c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .society-heading { text-align: center; font-size: 2.1em; font-weight: 900; margin: 12px 0 18px; background: linear-gradient(45deg, var(--gold), var(--gold-light), var(--red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(184, 134, 11, 0.2); }
        h2 { text-align: center; color: var(--red); margin: 20px 0; font-size: 1.6em; }
        label { display: flex; align-items: center; margin: 15px 0 6px; font-weight: bold; color: var(--red); font-size: 0.95em; }
        label i { margin-right: 6px; color: var(--gold); width: 18px; text-align: center; }
        input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid #ffe4b3; border-radius: 12px; font-family: inherit; font-size: 0.95em; background: #fffdf0; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        .required::after { content: " *"; color: #e74c3c; }
        .row { display: flex; gap: 12px; margin-bottom: 5px; }
        .row > div { flex: 1; }
        .photo-preview { width: 120px; height: 160px; margin: 15px auto; border: 5px solid var(--gold); border-radius: 15px; overflow: hidden; background: #fdfaf5; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 48px; color: var(--gold); cursor: pointer; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .final-btn, .action-btn { display: inline-block; padding: 12px 28px; border: none; border-radius: 30px; font-weight: bold; font-size: 1.1em; cursor: pointer; margin: 10px 6px; }
        .final-btn { background: var(--gold-light); color: white; }
        .final-btn:hover { background: var(--gold); }
        .action-btn { background: #48bb78; color: white; }
        .action-btn:hover { background: #38a169; }
        .reset-btn { background: #e74c3c !important; }
        .pdf-btn { background: #c0392b !important; }
        .modern-btn { background: var(--modern-accent) !important; }
        .success { display: none; text-align: center; padding: 20px; background: #d4edda; color: #155724; border-radius: 16px; margin-top: 20px; border: 2px solid #c3e6cb; }
        #downloadOptions { display: none; }
        
        /* Print Styles (Traditional and Modern) */
        #biodataPrint, #biodataPrintModern {
            position: absolute; left: -9999px; top: 0; width: 210mm; min-height: 297mm;
            /* ... (Other Print styles omitted for brevity) ... */
        }
        .traditional-photo-box, #biodataPrintModern > div > div:nth-of-type(3) > div:first-child > div:first-child {
            width: 200px; height: 263px; /* Ensure photo size is consistent */
            /* ... (Other Photo box styles omitted for brevity) ... */
        }
        @media print {
            body * { visibility: hidden; }
            #biodataPrint.active, #biodataPrint.active *, #biodataPrintModern.active, #biodataPrintModern.active * { visibility: visible; position: absolute; left: 0; top: 0; width: 210mm; background: white !important; }
            .form-container, .success, #downloadOptions { display: none !important; }
        }
    </style>
</head>
<body>

<div class="form-container" id="inputFormContainer">
    <div class="logo">श्री गणेशाय नमः</div>
    <div class="society-heading">बेलदार समाज</div>
    <h2>परिचय पत्र भरा</h2>

    <label for="title" class="required">ची. / कु.</label>
    <select id="title" required>
        <option value="">निवडा</option>
        <option value="ची.">ची. (वर)</option>
        <option value="कु.">कु. (वधू)</option>
    </select>

    <div style="text-align:center; margin:20px 0;">
        <label for="photo" class="required" style="display:block;">पासपोर्ट साइज फोटो</label>
        <input type="file" id="photo" accept="image/*" required style="display:none;">
        <div class="photo-preview" id="preview">
            <i class="fas fa-camera"></i>
        </div>
    </div>

    <form id="biodataForm" novalidate>
        <label class="required">नाव</label><input type="text" id="name" required>
        <div class="row"><div><label class="required">जन्म तारीख</label><input type="date" id="dob" required></div><div><label>जन्म वेळ</label><input type="time" id="time"></div></div>
        <label>जन्म ठिकाण</label><input type="text" id="birthplace">
        <label class="required">वर्ण</label><select id="varna" required><option value="">निवडा</option><option>गौर</option><option>सावळा</option><option>मध्यम</option></select>
        <label class="required">शिक्षण</label><input type="text" id="education" required>
        <label class="required">उंची</label><input type="text" id="height" required>
        <label>व्यवसाय</label><input type="text" id="occupation">
        <label class="required">अपेक्षा</label><textarea id="expectations" required rows="3"></textarea>
        <label class="required">वडीलांचे नाव</label><input type="text" id="father" required>
        <label class="required">पत्ता</label><textarea id="address" required rows="2"></textarea>
        <label>वडीलांचा व्यवसाय</label><input type="text" id="father_occupation">
        <label>शेती</label><input type="text" id="farming">
        <label>भाऊ</label><input type="text" id="brothers">
        <label>बहिण</label><input type="text" id="sisters">
        <label>मामाचे नाव</label><input type="text" id="mama">
        <label>संपर्क व्यक्ती</label><input type="text" id="contact_person">
        <label class="required">मोबाईल</label><input type="tel" id="contact" required pattern="[0-9]{10}">

        <div style="text-align:center; margin-top:25px;">
            <button type="button" class="final-btn" onclick="finalizeBiodata()">तयार करा</button>
            <button type="button" class="action-btn reset-btn" onclick="resetForm()">रिसेट</button>
        </div>
    </form>

    <div class="success" id="successMsg">
        <strong>परिचय पत्र तयार!</strong><br><br>
        <div style="margin-bottom: 15px; font-weight: bold;">टेम्पलेट निवडा:</div>
        <button type="button" class="action-btn" onclick="showTemplate('traditional')">पारंपरिक</button>
        <button type="button" class="action-btn modern-btn" onclick="showTemplate('modern')">आधुनिक</button>
    </div>
    
    <div id="downloadOptions" style="text-align:center; margin-top:15px;">
        <button type="button" class="action-btn" onclick="printBiodata()">प्रिंट</button>
        <button type="button" class="action-btn" id="saveJpeg">JPEG</button>
        <button type="button" class="action-btn pdf-btn" id="savePdf">PDF</button>
    </div>
</div>

<div id="biodataPrint">...</div>
<div id="biodataPrintModern">...</div>

<script>
    // ... (All previous JavaScript functions: getFormData, updatePrintData, finalizeBiodata, captureAndDownload etc. remain the same) ...
    const el = {
        title: document.getElementById('title'),
        form: document.getElementById('biodataForm'),
        photo: document.getElementById('photo'),
        preview: document.getElementById('preview'),
        success: document.getElementById('successMsg'),
        biodataPrint: document.getElementById('biodataPrint'),
        biodataPrintModern: document.getElementById('biodataPrintModern'),
        saveJpeg: document.getElementById('saveJpeg'),
        savePdf: document.getElementById('savePdf'),
        downloadOptions: document.getElementById('downloadOptions'),
        inputFormContainer: document.getElementById('inputFormContainer')
    };
    let photoURL = '';
    let currentTemplateId = 'biodataPrint'; // Default template
    function formatDateToDDMMYY(dateStr) {
        if (!dateStr) return '—';
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y.slice(-2)}`;
    }
    el.preview.addEventListener('click', () => el.photo.click());
    el.photo.addEventListener('change', () => {
        const file = el.photo.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { el.preview.innerHTML = `<img src="${e.target.result}" alt="फोटो">`; photoURL = e.target.result; };
            reader.readAsDataURL(file);
        }
    });
    function getFormData() {
        const data = {};
        el.form.querySelectorAll('input, select, textarea').forEach(input => {
            if (input.id) data[input.id] = input.value.trim();
        });
        data.title = el.title.value;
        return data;
    }
    function updatePrintData(templateId) {
        const d = getFormData();
        const suffix = templateId === 'biodataPrintModern' ? '_modern' : '';
        const fullName = d.title ? `${d.title} ${d.name || ''}`.trim() : '';
        const timeFormatted = d.time ? 
            new Date('1970-01-01T' + d.time).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit', hour12: true}) 
            : '—';

        document.getElementById(`print_name${suffix}`).textContent = fullName || '—';
        document.getElementById(`print_dob${suffix}`).textContent = formatDateToDDMMYY(d.dob);
        document.getElementById(`print_time${suffix}`).textContent = timeFormatted;
        document.getElementById(`print_birthplace${suffix}`).textContent = d.birthplace || '—';
        document.getElementById(`print_varna${suffix}`).textContent = d.varna || '—';
        document.getElementById(`print_education${suffix}`).textContent = d.education || '—';
        document.getElementById(`print_height${suffix}`).textContent = d.height || '—';
        document.getElementById(`print_occupation${suffix}`).textContent = d.occupation || '—';
        document.getElementById(`print_expectations${suffix}`).textContent = d.expectations || '—';
        document.getElementById(`print_father${suffix}`).textContent = d.father || '—';
        document.getElementById(`print_address${suffix}`).innerHTML = (d.address || '—').replace(/\n/g, '<br>');
        document.getElementById(`print_father_occupation${suffix}`).textContent = d.father_occupation || '—';
        document.getElementById(`print_farming${suffix}`).textContent = d.farming || '—';
        document.getElementById(`print_brothers${suffix}`).textContent = d.brothers || '—';
        document.getElementById(`print_sisters${suffix}`).textContent = d.sisters || '—';
        document.getElementById(`print_mama${suffix}`).textContent = d.mama || '—';
        document.getElementById(`print_contact_person${suffix}`).textContent = d.contact_person || '—';
        document.getElementById(`print_contact${suffix}`).textContent = d.contact || '—';

        const photoImg = document.getElementById(`print_photo${suffix}`);
        const defaultPlaceholderColor = templateId === 'biodataPrintModern' ? '#f5f5f5' : '#fdfaf5';
        const defaultPlaceholderText = templateId === 'biodataPrintModern' ? '#333' : '#b8860b';
        const placeholderSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect width="100%" height="100%" fill="${defaultPlaceholderColor}"/><text x="50%" y="50%" font-family="Arial" font-size="20" fill="${defaultPlaceholderText}" text-anchor="middle" dominant-baseline="middle">Photo</text></svg>`;
        
        photoImg.src = photoURL || `data:image/svg+xml;utf8,${encodeURIComponent(placeholderSvg)}`;
    }
    
    function setTemplateActive(templateId) {
        el.biodataPrint.classList.remove('active');
        el.biodataPrintModern.classList.remove('active');
        const activeEl = document.getElementById(templateId);
        if (activeEl) {
            activeEl.classList.add('active');
            currentTemplateId = templateId;
        }
    }

    function finalizeBiodata() {
        if (!el.title.value) return alert("कृपया 'ची. / कु.' निवडा");
        if (!el.form.checkValidity()) return el.form.reportValidity();
        
        updatePrintData('biodataPrint');
        updatePrintData('biodataPrintModern');

        el.form.style.display = 'none';
        el.success.style.display = 'block';
        el.downloadOptions.style.display = 'none'; 
        
        setTemplateActive(null);
    }

    function showTemplate(template) {
        el.success.style.display = 'none';
        el.downloadOptions.style.display = 'block'; 

        const templateId = template === 'modern' ? 'biodataPrintModern' : 'biodataPrint';
        setTemplateActive(templateId);
        
        alert(`'${template === 'modern' ? 'आधुनिक' : 'पारंपरिक'}' टेम्पलेट निवडले आहे. आता तुम्ही प्रिंट किंवा डाउनलोड करू शकता.`);
    }
    
    function printBiodata() {
        window.print();
    }

    function captureAndDownload(type) {
        const element = document.getElementById(currentTemplateId).firstElementChild;
        document.getElementById(currentTemplateId === 'biodataPrintModern' ? 'print_photo_modern' : 'print_photo').crossOrigin = 'anonymous';
        
        const backgroundColor = currentTemplateId === 'biodataPrintModern' ? 'white' : '#fdf6e3';
        const name = (el.title.value + (document.getElementById('name').value || 'परिचय-पत्र')).trim() + (currentTemplateId === 'biodataPrintModern' ? '-ModernBW' : '-Traditional-NoSVG');

        const originalParent = element.parentElement;
        const originalStyle = { position: originalParent.style.position, left: originalParent.style.left };

        originalParent.style.position = 'static';
        originalParent.style.left = 'auto';
        document.body.appendChild(originalParent);

        html2canvas(element, { scale: 3, useCORS: true, allowTaint: true, backgroundColor: backgroundColor, logging: false }).then(canvas => {
            const imgData = canvas.toDataURL('image/jpeg', 1.0);

            document.body.removeChild(originalParent);
            originalParent.style.position = originalStyle.position;
            originalParent.style.left = originalStyle.left;
            
            if (type === 'pdf') {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const w = pdf.internal.pageSize.getWidth();
                const h = pdf.internal.pageSize.getHeight();
                pdf.addImage(imgData, 'JPEG', 0, 0, w, h);
                pdf.save(`${name}.pdf`);
            } else {
                const a = document.createElement('a');
                a.download = `${name}.jpg`;
                a.href = imgData;
                a.click();
            }
        });
    }

    el.savePdf.onclick = () => captureAndDownload('pdf');
    el.saveJpeg.onclick = () => captureAndDownload('jpeg');

    function resetForm() {
        if (!confirm("सर्व डेटा डिलीट होईल?")) return;
        el.form.reset();
        el.title.selectedIndex = 0;
        el.preview.innerHTML = `<i class="fas fa-camera"></i>`;
        photoURL = '';
        el.success.style.display = 'none';
        el.downloadOptions.style.display = 'none';
        el.form.style.display = 'block';
        setTemplateActive(null);
    }
</script>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Registering the service worker with root scope './' for Netlify/GitHub compatibility
        navigator.serviceWorker.register('/service-worker.js', { scope: './' })
          .then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          })
          .catch(err => {
            console.error('ServiceWorker registration failed:', err); // Check DevTools Console for this error
          });
      });
    }
</script>
</body>
</html>
